    <meta property="og:title" content="Fabrice Rio, product designer using design and code" />
    <!-- DRAFT: site.og.description | sources: CONTENT.md 6, TH 05, TSS 5.3, AA User Testing | alternatives: Fabrice Rio designs in Figma and builds in code. He went to a vocational school for metal technology before he studied interaction design. -->
